# ──────────────────────────────────────────────────────────────────────────────
# The Bridge — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Pipeline stages:
#  1. build-and-test      → Compile + unit tests (H2) + JaCoCo coverage
#  2. sonarqube           → Static analysis + Quality Gate (depends on 1)
#  3. secret-scan         → Gitleaks — detect accidental secret commits (parallel)
#  4. dependency-scan     → OWASP Dependency Check (parallel)
#  5. docker-build-push   → Multi-stage build + Trivy scan + push ghcr.io (main only)
#  6. deploy-render       → Trigger Render deploy via API (main only, after docker)
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD — The Bridge

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

# Minimal permissions — principle of least privilege
permissions:
  contents: read
  packages: write        # required for ghcr.io image push
  security-events: write # required for Trivy SARIF upload

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/the-bridge

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Build + Unit Tests + Coverage ──────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for SonarQube blame analysis

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw compile --batch-mode --no-transfer-progress

      - name: Run tests with coverage (H2 in-memory, profile=test)
        run: |
          ./mvnw test \
            --batch-mode \
            --no-transfer-progress \
            -Dspring.profiles.active=test
        env:
          # Provide fake values required by application context even in test profile
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5ldmVyLXVzZS1pbi1wcm9k

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
        if: always()

      - name: Upload test results (surefire)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
        if: always()

  # ── Job 2: SonarQube Analysis ─────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      # Re-run tests to produce coverage report in this job's workspace
      - name: Run tests + generate coverage report
        run: |
          ./mvnw test \
            --batch-mode \
            --no-transfer-progress \
            -Dspring.profiles.active=test
        env:
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5ldmVyLXVzZS1pbi1wcm9k

      - name: SonarQube Analysis
        run: |
          ./mvnw sonar:sonar \
            --batch-mode \
            --no-transfer-progress \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'the-bridge-api' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.exclusions="**/DataSeeder.java,**/dto/**,**/entity/**,**/enumType/**,**/*Application.java"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 3: Secret Scan (Gitleaks) ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Detect secrets in codebase and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Job 4: Dependency Vulnerability Scan (OWASP) ─────────────────────────
  dependency-scan:
    name: Dependency Scan (OWASP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      - name: OWASP Dependency Check
        run: |
          ./mvnw verify \
            --batch-mode \
            --no-transfer-progress \
            -P security \
            -DskipTests \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }}
        continue-on-error: true  # Report but don't block on dependency vulnerabilities — review manually

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: target/dependency-check-report.*
          retention-days: 30
        if: always()

  # ── Job 5: Docker Build + Scan + Push ────────────────────────────────────
  # Only runs on pushes to main (not on PRs or feature branches)
  docker-build-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [sonarqube, secret-scan, dependency-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (no push — for scanning first)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Push Docker image to ghcr.io
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 6: Deploy to Render ───────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # GitHub Environment protection rules can gate this

    steps:
      - name: Trigger Render Deploy via API
        run: |
          HTTP_STATUS=$(curl --silent --output /tmp/render-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")

          cat /tmp/render-response.json
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Render deploy trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          DEPLOY_ID=$(cat /tmp/render-response.json | jq -r '.id')
          echo "Deploy triggered: $DEPLOY_ID"
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV

      - name: Wait for Render deploy to complete
        run: |
          echo "Waiting for Render deploy $DEPLOY_ID to complete..."
          MAX_WAIT=600  # 10 minutes
          ELAPSED=0
          INTERVAL=20

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl --silent \
              --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            echo "[$ELAPSED s] Deploy status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "::notice::✅ Render deploy completed successfully!"
              exit 0
            fi

            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::❌ Render deploy failed with status: $STATUS"
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::warning::⏰ Render deploy timeout after ${MAX_WAIT}s — check Render dashboard manually"
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "### Render Production Deploy 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Service ID:** \`${{ secrets.RENDER_SERVICE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
