# ──────────────────────────────────────────────────────────────────────────────
# The Bridge — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────────────────────
# Pipeline stages:
#  1. build-and-test      → Compile + unit tests (H2) + JaCoCo coverage
#  2. sonarqube           → Static analysis + Quality Gate (depends on 1)
#  3. secret-scan         → Gitleaks — detect accidental secret commits (parallel)
#  4. dependency-scan     → OWASP Dependency Check (parallel)
#  5. docker-build-push   → Multi-stage build + Trivy scan + push ghcr.io (main only)
#  6. deploy-render       → Trigger Render deploy via Deploy Hook or API (main only)
#  7. grafana-cloud       → Post-deploy monitoring, health check & Grafana Cloud annotations
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD — The Bridge

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'aziz'
  pull_request:
    branches:
      - 'main'
      - 'master'

# Minimal permissions — principle of least privilege
permissions:
  contents: read
  packages: write        # required for ghcr.io image push
  security-events: write # required for Trivy SARIF upload

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/the-bridge

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Build + Unit Tests + Coverage ──────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for SonarQube blame analysis

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw compile --batch-mode --no-transfer-progress

      - name: Run tests with coverage (H2 in-memory, profile=test)
        run: |
          ./mvnw test \
            --batch-mode \
            --no-transfer-progress \
            -Dspring.profiles.active=test
        env:
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5ldmVyLXVzZS1pbi1wcm9k

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
        if: always()

      - name: Upload test results (surefire)
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
        if: always()

  # ── Job 2: SonarQube Analysis ─────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    # Expose secrets as env vars so we can use them in `if:` conditions
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 17 — compile & tests (project targets Java 17)
      - name: Set up Java 17 (build & test)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      # Re-run tests to produce coverage report in this job's workspace
      - name: Run tests + generate coverage report (Java 17)
        run: |
          ./mvnw test \
            --batch-mode \
            --no-transfer-progress \
            -Dspring.profiles.active=test
        env:
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5ldmVyLXVzZS1pbi1wcm9k

      # Java 21 — SonarCloud scanner 4.x requires Java 21+
      # We install it alongside Java 17; Maven still compiles with 17 but
      # the JVM running sonar:sonar will be 21.
      - name: Set up Java 21 (for SonarCloud scanner)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # no cache here — reuse the Maven cache already populated by Java 17 step

      - name: SonarQube Analysis & Quality Gate Check
        if: env.SONAR_TOKEN != ''
        continue-on-error: true  # Report SonarCloud result/error without blocking pipeline
        run: |
          SONAR_ORG="${{ vars.SONAR_ORGANIZATION || github.repository_owner }}"
          SONAR_KEY="${{ vars.SONAR_PROJECT_KEY || 'the-bridge-api' }}"
          SONAR_URL="${{ env.SONAR_HOST_URL || 'https://sonarcloud.io' }}"

          echo "ℹ️  Running SonarQube/SonarCloud analysis for project: $SONAR_KEY, org: $SONAR_ORG on $SONAR_URL"

          ./mvnw sonar:sonar \
            --batch-mode \
            --no-transfer-progress \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.projectKey=$SONAR_KEY \
            -Dsonar.organization=$SONAR_ORG \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Skip Notice
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN secret is not set. Skipping SonarQube analysis."

  # ── Job 3: Secret Scan (Gitleaks) ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Detect secrets in codebase and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Job 4: Dependency Vulnerability Scan (OWASP) ─────────────────────────
  dependency-scan:
    name: Dependency Scan (OWASP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Maven wrapper permissions
        run: chmod +x mvnw

      - name: OWASP Dependency Check
        run: |
          ./mvnw verify \
            --batch-mode \
            --no-transfer-progress \
            -P security \
            -DskipTests \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }}
        continue-on-error: true  # Report but don't block — review manually

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: target/dependency-check-report.*
          retention-days: 30
        if: always()

  # ── Job 5: Docker Build + Scan + Push ─────────────────────────────────────
  # Only runs on push to main / master / aziz
  docker-build-push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [sonarqube, secret-scan, dependency-scan]
    if: |
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/aziz') &&
      github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (no push — scan first)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Push Docker image to ghcr.io
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 6: Deploy to Render ───────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: |
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/aziz') &&
      github.event_name == 'push'
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
      # ── Option A: Deploy Hook (preferred — simpler, no polling needed) ────
      - name: Trigger Render via Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "▶ Triggering Render deploy via Deploy Hook..."
          HTTP_STATUS=$(curl --silent --output /tmp/render-hook.txt \
            --write-out "%{http_code}" \
            -X POST "${{ env.RENDER_DEPLOY_HOOK_URL }}")
          cat /tmp/render-hook.txt || true
          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "::notice::✅ Render deploy triggered via Deploy Hook!"
          else
            echo "::error::Deploy Hook failed — HTTP $HTTP_STATUS"
            exit 1
          fi

      # ── Option B: Render API (fallback) ──────────────────────────────────
      - name: Trigger Render via API
        if: env.RENDER_DEPLOY_HOOK_URL == '' && env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          HTTP_STATUS=$(curl --silent --output /tmp/render-api.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys")

          cat /tmp/render-api.json
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Render API deploy failed — HTTP $HTTP_STATUS"
            exit 1
          fi

          DEPLOY_ID=$(cat /tmp/render-api.json | jq -r '.id')
          echo "Deploy ID: $DEPLOY_ID"
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV

      - name: Wait for Render deploy to go live
        if: env.RENDER_DEPLOY_HOOK_URL == '' && env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=20

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl --silent \
              --header "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            echo "[$ELAPSED s] status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "::notice::✅ Render deploy is live!"
              exit 0
            fi

            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || \
               [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::❌ Render deploy failed: $STATUS"
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::warning::⏰ Timeout after ${MAX_WAIT}s — check Render dashboard"
          exit 1

      - name: No Render credentials configured
        if: env.RENDER_DEPLOY_HOOK_URL == '' && (env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '')
        run: echo "::warning::No Render credentials found (RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY+RENDER_SERVICE_ID). Skipping deploy."

      - name: Deploy summary
        if: always()
        run: |
          echo "### Render Production Deploy 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ── Job 7: Grafana Cloud Monitoring & Observability ──────────────────────
  grafana-cloud:
    name: Grafana Cloud Monitoring
    runs-on: ubuntu-latest
    needs: deploy-render
    if: |
      always() &&
      (needs.deploy-render.result == 'success' || needs.deploy-render.result == 'skipped') &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/aziz') &&
      github.event_name == 'push'
    environment: production
    env:
      GRAFANA_CLOUD_URL: ${{ secrets.GRAFANA_CLOUD_URL }}
      GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      APP_HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'https://nineantra-the-bridge-backend.onrender.com/actuator/health' }}
      APP_METRICS_URL: ${{ vars.PROD_METRICS_URL || 'https://nineantra-the-bridge-backend.onrender.com/actuator/prometheus' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1. Health check verification post-deployment
      - name: Verify Backend Health (Production)
        run: |
          echo "🔍 Checking production backend health at: ${{ env.APP_HEALTH_URL }}"
          MAX_RETRIES=12
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl --silent --output /tmp/health_response.json --write-out "%{http_code}" "${{ env.APP_HEALTH_URL }}" || echo "000")
            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES - Primary Health (${{ env.APP_HEALTH_URL }}) HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Backend is healthy and responding!"
              cat /tmp/health_response.json || true
              SUCCESS=true
              break
            fi

            # Fallback check on /api/health
            FALLBACK_URL="https://nineantra-the-bridge-backend.onrender.com/api/health"
            FB_STATUS=$(curl --silent --output /tmp/fb_response.json --write-out "%{http_code}" "$FALLBACK_URL" || echo "000")
            echo "  Fallback Health ($FALLBACK_URL) HTTP Status: $FB_STATUS"
            if [ "$FB_STATUS" -ge 200 ] && [ "$FB_STATUS" -lt 400 ]; then
              echo "✅ Backend is healthy on fallback endpoint /api/health!"
              cat /tmp/fb_response.json || true
              SUCCESS=true
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "⏳ Waiting 15s before next health check retry..."
            sleep 15
          done

          if [ "$SUCCESS" = false ]; then
            echo "::warning::Backend health endpoint did not return 2xx within expected window. The service may still be warming up on Render."
          fi

      # 2. Send Deployment Annotation to Grafana Cloud
      - name: Send Deployment Annotation to Grafana Cloud
        if: env.GRAFANA_CLOUD_URL != '' && env.GRAFANA_CLOUD_API_KEY != ''
        run: |
          GRAFANA_BASE_URL="${GRAFANA_CLOUD_URL%/}"
          NOW_SEC=$(date +%s)
          TIMESTAMP_MS=$(( NOW_SEC * 1000 ))
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | cut -c1-100)
          AUTHOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          ANNOTATION_TEXT="🚀 Deploy to Render | Branch: $REF_NAME | Commit: ${SHA:0:7} ($COMMIT_MSG) | Author: $AUTHOR | Run: $RUN_URL"

          echo "📡 Sending deployment annotation to Grafana Cloud ($GRAFANA_BASE_URL/api/annotations)..."

          ANNOTATION_PAYLOAD=$(jq -n \
            --argjson time "$TIMESTAMP_MS" \
            --arg text "$ANNOTATION_TEXT" \
            --arg branch "$REF_NAME" \
            '{time: $time, timeEnd: $time, tags: ["deployment", "production", "render", "the-bridge", $branch], text: $text}')

          HTTP_CODE=$(curl -s -o /tmp/grafana_annotation_resp.json -w "%{http_code}" \
            -X POST "$GRAFANA_BASE_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_CLOUD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$ANNOTATION_PAYLOAD")

          echo "HTTP Response: $HTTP_CODE"
          cat /tmp/grafana_annotation_resp.json || true
          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::✅ Grafana Cloud deployment annotation posted successfully!"
          else
            echo "::warning::Failed to post annotation to Grafana Cloud (HTTP $HTTP_CODE)."
          fi

      # 3. Sync Dashboard to Grafana Cloud (Optional / Automatic)
      - name: Sync Dashboard to Grafana Cloud
        if: env.GRAFANA_CLOUD_URL != '' && env.GRAFANA_CLOUD_API_KEY != ''
        run: |
          GRAFANA_BASE_URL="${GRAFANA_CLOUD_URL%/}"
          DASHBOARD_FILE="docker/grafana/provisioning/dashboards/spring-boot-dashboard.json"

          if [ -f "$DASHBOARD_FILE" ]; then
            echo "📊 Syncing Spring Boot dashboard to Grafana Cloud..."
            PAYLOAD=$(jq -n --slurpfile dash "$DASHBOARD_FILE" '{"dashboard": $dash[0], "overwrite": true, "message": "Updated via CI/CD"}')

            HTTP_CODE=$(curl -s -o /tmp/grafana_dash_resp.json -w "%{http_code}" \
              -X POST "$GRAFANA_BASE_URL/api/dashboards/db" \
              -H "Authorization: Bearer $GRAFANA_CLOUD_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            echo "Dashboard sync HTTP Response: $HTTP_CODE"
            cat /tmp/grafana_dash_resp.json || true
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "::notice::✅ Grafana Cloud dashboard synced successfully!"
            else
              echo "::warning::Dashboard sync returned HTTP $HTTP_CODE (may require datasource adjustment or dashboard folder creation)."
            fi
          fi

      # 4. Notice when Grafana Cloud secrets are not configured
      - name: Grafana Cloud Skip Notice
        if: env.GRAFANA_CLOUD_URL == '' || env.GRAFANA_CLOUD_API_KEY == ''
        run: |
          echo "::warning::GRAFANA_CLOUD_URL or GRAFANA_CLOUD_API_KEY secret is not configured. Skipping Grafana Cloud annotations & sync."

      # 5. Monitoring Summary Step
      - name: Monitoring Summary
        if: always()
        run: |
          echo "### Grafana Cloud & Production Monitoring 📈" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint:** \`${{ env.APP_HEALTH_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Metrics Endpoint:** \`${{ env.APP_METRICS_URL }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.GRAFANA_CLOUD_URL }}" ]; then
            echo "- **Grafana Cloud Instance:** \`${{ env.GRAFANA_CLOUD_URL }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployment Annotations:** Sent to Grafana Cloud timeline ⏱️" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Grafana Cloud:** *Not configured (Add GRAFANA_CLOUD_URL and GRAFANA_CLOUD_API_KEY)*" >> $GITHUB_STEP_SUMMARY
          fi

