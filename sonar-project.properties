# SonarCloud / SonarQube — The Bridge
# REMPLACER les valeurs REPLACE_WITH_* avant la première analyse.
# Ce fichier est commité : il ne doit contenir AUCUN secret.
# Le SONAR_TOKEN doit être un GitHub Secret, pas dans ce fichier.

sonar.projectKey=the-bridge-api
sonar.projectName=The Bridge API
sonar.projectVersion=1.0

# SonarCloud — décommenter si organisation SonarCloud utilisée
# sonar.organization=REPLACE_WITH_YOUR_SONARCLOUD_ORG

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo coverage report
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encodage
sonar.sourceEncoding=UTF-8

# Exclusions — seed data, generated DTOs, enums, entités pure
sonar.exclusions=\
  **/DataSeeder.java,\
  **/dto/**,\
  **/entity/**,\
  **/enumType/**,\
  **/*Application.java,\
  **/config/SwaggerConfig.java

sonar.test.exclusions=\
  **/DataSeeder.java
