# ──────────────────────────────────────────────────────────────────────────────
# SECRET EXAMPLE — NE JAMAIS COMMITER LE VRAI FICHIER AVEC DE VRAIES VALEURS
# ──────────────────────────────────────────────────────────────────────────────
# Ce fichier est un TEMPLATE. Pour créer le vrai Secret :
#
#   1. Encoder chaque valeur en base64 :
#         echo -n "valeur_reelle" | base64
#
#   2. Créer un fichier secret.yaml LOCAL (jamais commité) avec les vraies valeurs
#
#   3. Appliquer :
#         kubectl apply -f secret.yaml -n the-bridge
#
#   4. Supprimer le fichier local après application.
#
# Ou utiliser une solution de secrets management (Sealed Secrets, Vault, etc.)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: the-bridge-secrets
  namespace: the-bridge
  labels:
    app.kubernetes.io/name: the-bridge
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Toutes les valeurs sont en base64. Remplacer REPLACE_WITH_BASE64 par la vraie valeur encodée.
  # echo -n "votre-valeur" | base64

  DATABASE_URL: REPLACE_WITH_BASE64
  DATABASE_PASSWORD: REPLACE_WITH_BASE64

  JWT_SECRET: REPLACE_WITH_BASE64

  MAIL_USERNAME: REPLACE_WITH_BASE64
  MAIL_PASSWORD: REPLACE_WITH_BASE64

  CLOUDINARY_CLOUD_NAME: REPLACE_WITH_BASE64
  CLOUDINARY_API_KEY: REPLACE_WITH_BASE64
  CLOUDINARY_API_SECRET: REPLACE_WITH_BASE64

  GOOGLE_CLIENT_ID: REPLACE_WITH_BASE64
  GOOGLE_CLIENT_SECRET: REPLACE_WITH_BASE64

  FACEBOOK_CLIENT_ID: REPLACE_WITH_BASE64
  FACEBOOK_CLIENT_SECRET: REPLACE_WITH_BASE64

  STRIPE_SECRET_KEY: REPLACE_WITH_BASE64
  STRIPE_PUBLISHABLE_KEY: REPLACE_WITH_BASE64
  STRIPE_WEBHOOK_SECRET: REPLACE_WITH_BASE64

  BLOCKCHAIN_PRIVATE_KEY: REPLACE_WITH_BASE64

  SPRING_DATA_REDIS_PASSWORD: REPLACE_WITH_BASE64
