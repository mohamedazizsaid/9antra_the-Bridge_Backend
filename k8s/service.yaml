apiVersion: v1
kind: Service
metadata:
  name: the-bridge-service
  namespace: the-bridge
  labels:
    app.kubernetes.io/name: the-bridge
    app.kubernetes.io/component: service
spec:
  type: NodePort
  selector:
    app: the-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: management
      port: 8081
      targetPort: 8081
      nodePort: 30081
