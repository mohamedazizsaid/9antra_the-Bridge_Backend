apiVersion: v1
kind: ConfigMap
metadata:
  name: the-bridge-config
  namespace: the-bridge
  labels:
    app.kubernetes.io/name: the-bridge
    app.kubernetes.io/component: config
data:
  # Spring Boot
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # Database — non-sensitive connection parameters only
  # DATABASE_URL is in the Secret (it includes the password in some formats)
  # Alternatively use separate host/port here and password in Secret
  DATABASE_USERNAME: "root"

  # CORS — update to your production frontend URL
  CORS_ALLOWED_ORIGINS: "https://your-frontend.onrender.com"

  # Redis — host/port only (password is in Secret)
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"

  # Blockchain — safe to expose (testnet only)
  BLOCKCHAIN_ENABLED: "false"
  BLOCKCHAIN_RPC_URL: "https://rpc-amoy.polygon.technology/"
  BLOCKCHAIN_CHAIN_ID: "80002"

  # Rate limiting
  RATE_LIMIT_GLOBAL_PER_MIN: "100"
  RATE_LIMIT_LOGIN_PER_MIN: "5"
  RATE_LIMIT_REGISTER_PER_10MIN: "3"
  RATE_LIMIT_PASSWORD_RESET_PER_15MIN: "3"
  RATE_LIMIT_EXPENSIVE_PER_MIN: "10"
  RATE_LIMIT_AUTHENTICATED_PER_MIN: "120"

  # Stripe URLs — non-sensitive
  STRIPE_SUCCESS_URL: "http://localhost:4200/payment-success?session_id={CHECKOUT_SESSION_ID}"
  STRIPE_CANCEL_URL: "http://localhost:4200/payment-fail"
