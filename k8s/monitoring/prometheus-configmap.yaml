apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: the-bridge
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'the-bridge-monitor'

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape The Bridge application via Spring Boot Actuator /actuator/prometheus
      - job_name: 'the-bridge'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['the-bridge-service:8081']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - target_label: application
            replacement: the-bridge

      # Scrape Kubernetes nodes (optional, requires node-exporter)
      # - job_name: 'kubernetes-nodes'
      #   kubernetes_sd_configs:
      #     - role: node
