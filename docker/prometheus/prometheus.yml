global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The Bridge — Spring Boot Actuator Prometheus endpoint
  - job_name: 'the-bridge'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['the-bridge-backend:8081', 'host.docker.internal:8081']
    relabel_configs:
      - target_label: application
        replacement: the-bridge

