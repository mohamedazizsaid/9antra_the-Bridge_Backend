spring.application.name=the_bridge
spring.config.import=optional:file:.env[.properties],optional:file:the_bridge/.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/the_bridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

db.ssl.truststore=${DB_SSL_TRUSTSTORE_PATH:}
db.ssl.truststore.password=${DB_SSL_TRUSTSTORE_PASSWORD:}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration=36000000

# ─── MAIL (Gmail) ────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── CLOUDINARY ──────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── OAUTH2 — GOOGLE ─────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ─── OAUTH2 — FACEBOOK ───────────────────────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ─── MULTIPART (Avatar upload) ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080

# ─── STRIPE PAYMENT GATEWAY ──────────────────────────────────────────────────
stripe.api-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:}
stripe.cancel-url=${STRIPE_CANCEL_URL:}

# ─── POLYGON BLOCKCHAIN (AMOY TESTNET) ───────────────────────────────────────
blockchain.enabled=${BLOCKCHAIN_ENABLED:}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}

# ─── REDIS & RATE LIMITING ───────────────────────────────────────────────────
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

rate.limit.global.per-min=${RATE_LIMIT_GLOBAL_PER_MIN:}
rate.limit.login.per-min=${RATE_LIMIT_LOGIN_PER_MIN:}
rate.limit.register.per-10min=${RATE_LIMIT_REGISTER_PER_10MIN:}
rate.limit.password-reset.per-15min=${RATE_LIMIT_PASSWORD_RESET_PER_15MIN:}
rate.limit.expensive.per-min=${RATE_LIMIT_EXPENSIVE_PER_MIN:}
rate.limit.authenticated.per-min=${RATE_LIMIT_AUTHENTICATED_PER_MIN:}

# ─── REVERSE PROXY / RENDER ──────────────────────────────────────────────────
server.forward-headers-strategy=framework

# ─── DATABASE CONNECTION POOL (HikariCP) ─────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ─── SPRING BOOT ACTUATOR ────────────────────────────────────────────────────
# Actuator runs on a separate management port (8081) so it is never exposed
# via the public-facing Render/Kubernetes ingress on port 8080.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ─── MONITORING / ACTUATOR CREDENTIALS ──────────────────────────────────────
monitoring.user.username=${MONITORING_USERNAME:admin}
monitoring.user.password=${MONITORING_PASSWORD:admin}

# ─── PROMETHEUS METRICS ──────────────────────────────────────────────────────
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
